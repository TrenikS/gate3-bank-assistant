# Шаблоны ответов ассистента. Проверяет Иван как «эксперт поддержки».
#
# Правила:
# - {плейсхолдеры} заполняет КОД значениями из DWH после (возможного) перефраза LLM.
#   LLM видит только текст с плейсхолдерами и не может «придумать» цифру.
# - Цифры, написанные прямо в шаблоне (например «в 00:00»), считаются проверенными экспертом.
# - must_keep — фразы, которые LLM обязана сохранить при перефразе (отрицания, ключевые факты).
#   Если пропала — fallback на исходный шаблон.
# - Для бугуртящих порядок: признать эмоцию → снять главный страх фактом → причина из данных → действие.
# - variants выбираются кодом по данным (например, по коду причины отказа).
# - no_data — что говорим, если в DWH нет подходящей операции (не выдумываем).
# - actions — кнопки «результат, а не инструкция» (в прототипе — имитация).

intents:
  # ───────────── Бугуртящие ─────────────
  declined_card_payment:
    segment: бугуртящие
    title: Оплата картой не прошла
    variants:
      limit_exceeded:
        text: >-
          Понимаю, неприятно, когда оплата не проходит. Деньги не списаны: оплата {amount} в {merchant}
          {datetime} отклонена. Причина — исчерпан дневной лимит по карте {card}: сегодня потрачено
          {spent_today} из {daily_limit}. Лимит можно поднять прямо сейчас кнопкой ниже, иначе он
          обновится в 00:00 по Москве.
        must_keep: ["не списаны"]
        actions: ["Изменить лимит"]
      insufficient_funds:
        text: >-
          Понимаю, неприятно. Деньги не списаны: оплата {amount} в {merchant} {datetime} отклонена,
          потому что на карте {card} не хватило средств — доступно {balance}. Пополните карту или
          выберите другую карту при оплате.
        must_keep: ["не списаны", "не хватило"]
        actions: ["Пополнить карту"]
      card_blocked:
        text: >-
          Понимаю, неприятно. Деньги не списаны: оплата {amount} в {merchant} {datetime} отклонена,
          потому что карта {card} заблокирована ({block_reason}). Передаю запрос на разблокировку
          специалисту — он ответит здесь же.
        must_keep: ["не списаны", "заблокирована"]
        handoff: true
      merchant_error:
        text: >-
          Понимаю, неприятно. Деньги не списаны: оплата {amount} в {merchant} {datetime} не прошла
          из-за технической ошибки на стороне магазина, с картой {card} всё в порядке. Попробуйте
          повторить оплату.
        must_keep: ["не списаны", "всё в порядке"]
      wrong_pin:
        text: >-
          Понимаю, неприятно. Деньги не списаны: оплата {amount} в {merchant} {datetime} отклонена
          из-за неверно введённого PIN-кода карты {card}. Если вы не помните PIN, его можно сменить
          прямо здесь.
        must_keep: ["не списаны", "неверно"]
        actions: ["Сменить PIN"]
    no_data: >-
      Я проверил операции по вашим картам за последние 7 дней — отклонённых оплат не вижу.
      Подскажите, где и примерно когда вы пытались оплатить: проверю ещё раз или подключу специалиста.

  declined_transfer:
    segment: бугуртящие
    title: Перевод не прошёл
    variants:
      limit_exceeded:
        text: >-
          Понимаю, неприятно. Деньги не списаны: перевод {amount} получателю {recipient} ({method})
          {datetime} отклонён — превышен лимит на переводы: {limit_used} из {transfer_limit} за месяц.
          Лимит можно увеличить кнопкой ниже.
        must_keep: ["не списаны"]
        actions: ["Изменить лимит переводов"]
      insufficient_funds:
        text: >-
          Понимаю, неприятно. Деньги не списаны: перевод {amount} получателю {recipient} {datetime}
          отклонён, потому что на счёте не хватило средств с учётом комиссии {fee} — доступно {balance}.
        must_keep: ["не списаны", "не хватило"]
      recipient_details_invalid:
        text: >-
          Понимаю, неприятно. Деньги не списаны: перевод {amount} {datetime} отклонён, потому что
          банк получателя не нашёл счёт по указанным реквизитам ({method}). Проверьте реквизиты и
          повторите перевод.
        must_keep: ["не списаны"]
        actions: ["Повторить перевод"]
      antifraud_check:
        text: >-
          Деньги не списаны: перевод {amount} {datetime} остановлен проверкой безопасности.
          Передаю вас специалисту — он подтвердит перевод вместе с вами.
        must_keep: ["не списаны"]
        handoff: true
    no_data: >-
      Я не вижу отклонённых переводов за последние 7 дней. Подскажите сумму и примерную дату
      перевода — проверю ещё раз или подключу специалиста.

  card_payment_fee_charged:
    segment: бугуртящие
    title: Взяли комиссию за операцию
    variants:
      default:
        text: >-
          Понимаю, комиссия — всегда неприятный сюрприз. За операцию {amount} в {merchant} {datetime}
          по карте {card} списана комиссия {fee}. Причина — {fee_reason}. {fee_advice}
        must_keep: []
    no_data: >-
      За последние 30 дней я не вижу комиссий по вашим картам. Возможно, речь о другом списании —
      подскажите сумму или дату, я проверю.

  card_payment_not_recognised:
    segment: бугуртящие
    title: Не узнаю операцию
    variants:
      default:
        text: >-
          Давайте разберёмся. Операция {amount} {datetime} с названием «{descriptor}» — это {merchant}
          ({merchant_category}): так этот продавец подписывается в банковской выписке. Если вы её не
          совершали, нажмите «Это не я» — я сразу подключу специалиста по безопасности.
        must_keep: []
        actions: ["Это не я"]
      suspicious_descriptor:
        text: >-
          Давайте разберёмся. Операция {amount} {datetime} проведена у продавца {merchant}, но её
          описание в выписке выглядит необычно. Я передаю операцию специалисту по безопасности — он
          проверит её и ответит здесь же. Если вы её не совершали, нажмите «Это не я».
        must_keep: []
        actions: ["Это не я"]
        handoff: true
    no_data: >-
      Пришлите, пожалуйста, сумму или дату операции, которую вы не узнаёте, — я найду её и
      расшифрую название продавца. Если подозреваете мошенничество, нажмите «Это не я».

  transaction_charged_twice:
    segment: бугуртящие
    title: Списали дважды
    variants:
      hold:
        text: >-
          Понимаю, двойное списание пугает. Второй раз деньги не списаны: из двух операций по {amount}
          в {merchant} ({datetime} и {datetime2}) вторая — временная блокировка суммы, а не списание.
          Она снимется автоматически до {release_date}.
        must_keep: ["не списаны", "не списание"]
      settled:
        text: >-
          Понимаю, двойное списание — это неприятно. Вижу две проведённые операции по {amount} в
          {merchant}: {datetime} и {datetime2}. Я оформил запрос на возврат второго списания,
          номер {ticket_id}, ответ — до {ticket_due}.
        must_keep: []
    no_data: >-
      Я не вижу повторных списаний с одинаковой суммой за последние 7 дней. Подскажите магазин
      и сумму — проверю ещё раз.

  extra_charge_on_statement:
    segment: бугуртящие
    title: Непонятное списание в выписке
    variants:
      default:
        text: >-
          Понимаю, непонятные списания тревожат. Списание {amount} {datetime} — это {charge_name}:
          {charge_reason}. {charge_action}
        must_keep: []
    no_data: >-
      За последние 30 дней я не вижу служебных списаний по вашим счетам. Подскажите сумму или
      дату — найду операцию и объясню, что это.

  # ───────────── Ждущие ─────────────
  pending_transfer:
    segment: ждущие
    title: Перевод в обработке
    variants:
      default:
        text: >-
          Перевод {amount} получателю {recipient} ({method}), отправленный {datetime}, сейчас в статусе
          «{status_text}». Зачисление ожидается до {expected_at}. Я сам проверю статус {followup_at}
          и напишу вам.
        must_keep: []
        followup: true
    no_data: >-
      У вас нет переводов в обработке — все переводы за последние 7 дней завершены. Если речь о
      конкретном переводе, подскажите сумму или получателя.

  transfer_not_received_by_recipient:
    segment: ждущие
    title: Получатель не получил перевод
    variants:
      completed:
        text: >-
          С нашей стороны перевод {amount} получателю {recipient} выполнен {completed_at}: деньги
          отправлены в {recipient_bank}. Зачисление на стороне банка получателя ожидается до
          {expected_at}. Если к этому времени деньги не придут, я сам подключу специалиста — проверю
          {followup_at}.
        must_keep: []
        followup: true
      overdue:
        text: >-
          Вижу, что перевод {amount} получателю {recipient}, отправленный {datetime}, задерживается: он в статусе
          «{status_text}», а должен был прийти до {expected_at}. Я передал запрос специалисту,
          номер {ticket_id}, ответ — до {ticket_due}.
        must_keep: []
        handoff: true
    no_data: >-
      Я не вижу недавних переводов, которые могли не дойти. Подскажите сумму и дату перевода — проверю.

  pending_card_payment:
    segment: ждущие
    title: Оплата картой в обработке
    variants:
      default:
        text: >-
          Оплата {amount} ({merchant}, {datetime}) пока в обработке: сумма заблокирована на карте {card},
          но окончательно ещё не списана. Магазин должен подтвердить её до {hold_until}; если не
          подтвердит — сумма вернётся на карту автоматически.
        must_keep: ["не списана"]
    no_data: >-
      Сейчас у вас нет операций в обработке — все оплаты проведены. Подскажите сумму или магазин,
      и я проверю конкретную операцию.

  card_arrival:
    segment: ждущие
    title: Когда придёт карта
    variants:
      in_delivery:
        text: >-
          Карта {card} заказана {order_date}, сейчас статус — «{delivery_status}». Плановая дата
          доставки — {delivery_date}, {delivery_method}. Если планы изменились, дату и адрес доставки можно
          поменять в разделе «Карты».
        must_keep: []
      delivered:
        text: >-
          Карта {card} уже доставлена {delivery_date}. Осталось активировать её — это можно сделать прямо здесь.
        must_keep: []
        actions: ["Активировать карту"]
    no_data: >-
      Я не вижу заказанных карт в доставке. Если хотите заказать новую карту, нажмите кнопку ниже.

  Refund_not_showing_up:
    segment: ждущие
    title: Не пришёл возврат
    variants:
      pending:
        text: >-
          Вижу возврат {amount} от {merchant}: магазин оформил его {initiated_at}, сейчас статус —
          «{refund_status}». Зачисление на карту {card} ожидается до {expected_by}.
        must_keep: []
      overdue:
        text: >-
          Возврат {amount} от {merchant}, оформленный {initiated_at}, должен был прийти до {expected_by},
          но ещё не зачислен. Я передал запрос специалисту, номер {ticket_id}, ответ — до {ticket_due}.
        must_keep: ["не зачислен"]
        handoff: true
    no_data: >-
      Возвратов от магазинов на ваши карты пока не поступало. Обычно магазин передаёт возврат в банк
      в течение нескольких дней после оформления — уточните у продавца дату, и если прошло больше
      30 дней, я подключу специалиста.

  # ───────────── Ищущие ─────────────
  activate_my_card:
    segment: ищущие
    title: Активировать карту
    variants:
      not_activated:
        text: >-
          Карта {card} доставлена {delivery_date} и ждёт активации. Активируйте её прямо здесь кнопкой
          ниже — подтверждение придёт пуш-уведомлением, PIN-код можно задать сразу после.
        must_keep: []
        actions: ["Активировать карту"]
      already_active:
        text: >-
          Карта {card} уже активна — ей можно платить. Если нужно задать или сменить PIN-код,
          это можно сделать прямо здесь.
        must_keep: []
        actions: ["Сменить PIN"]
      in_delivery:
        text: >-
          Карта {card} ещё в доставке — плановая дата {delivery_date}. Активировать её можно будет
          сразу после получения, прямо в этом чате.
        must_keep: []
    no_data: >-
      Я не вижу у вас карт, которые ждут активации. Если вы получили новую карту, подскажите
      последние 4 цифры её номера.

  change_pin:
    segment: ищущие
    title: Сменить PIN
    variants:
      blocked:
        text: >-
          Карта {card} сейчас заблокирована ({block_reason}), поэтому сменить PIN можно будет после
          разблокировки. Передаю запрос на разблокировку специалисту — он ответит здесь же.
        must_keep: ["заблокирована"]
        handoff: true
      default:
        text: >-
          Сменить PIN карты {card} можно прямо здесь: нажмите «Сменить PIN» ниже и введите новый код
          в защищённом окне. Мне PIN сообщать не нужно — сотрудники банка его никогда не спрашивают.
        must_keep: ["не нужно"]
        actions: ["Сменить PIN"]
    no_data: >-
      Я не вижу у вас активных карт. Если карта новая, сначала её нужно активировать.

  receiving_money:
    segment: ищущие
    title: Реквизиты для перевода
    variants:
      default:
        text: >-
          Ваши реквизиты для получения перевода: получатель {full_name}, счёт {account_number},
          банк {bank_name}, БИК {bik}, корр. счёт {corr_account}. Для перевода по СБП или внутри банка
          достаточно вашего номера телефона {phone_masked}. Могу сохранить реквизиты в PDF — кнопка ниже.
        must_keep: []
        actions: ["Скачать реквизиты (PDF)"]
    no_data: >-
      Не нашёл ваш счёт. Передаю вопрос специалисту.

  edit_personal_details:
    segment: ищущие
    title: Изменить личные данные
    variants:
      default:
        text: >-
          Сейчас у вас указан телефон {phone_masked} и e-mail {email_masked}. Их можно поменять прямо
          здесь кнопкой ниже, подтверждение — кодом из SMS. Для смены ФИО или паспортных данных нужен
          визит в офис с новым паспортом.
        must_keep: []
        actions: ["Изменить контакты"]
    no_data: >-
      Передаю вопрос специалисту — он поможет изменить данные.

  # ───────────── Острые (только эскалация) ─────────────
  compromised_card:
    segment: острые
    title: Подозрение на мошенничество
    escalate: true
    variants:
      default:
        text: >-
          Срочно подключаю специалиста по безопасности. Чтобы деньги были в безопасности, прямо
          сейчас заблокируйте карту {card} кнопкой ниже — это можно отменить. Никому не называйте
          коды из SMS, CVC и PIN: сотрудники банка их никогда не спрашивают.
        must_keep: []
        actions: ["Заблокировать карту"]
    no_data: >-
      Срочно подключаю специалиста по безопасности. Никому не называйте коды из SMS, CVC и PIN:
      сотрудники банка их никогда не спрашивают.

  lost_or_stolen_card:
    segment: острые
    title: Карта потеряна или украдена
    escalate: true
    variants:
      default:
        text: >-
          Сочувствую. Первым делом заблокируйте карту {card} кнопкой ниже — после этого ей никто
          не сможет воспользоваться. Подключаю специалиста: он проверит последние операции и
          поможет перевыпустить карту.
        must_keep: []
        actions: ["Заблокировать карту"]
    no_data: >-
      Сочувствую. Подключаю специалиста: он заблокирует карту и поможет перевыпустить её.

# Служебные ответы маршрутизатора (без данных клиента)
system:
  clarify: "Уточните, пожалуйста, что из этого ближе к вашему вопросу:"
  handoff: >-
    Передаю ваш вопрос специалисту — он уже видит нашу переписку, повторять ничего не придётся.
  handoff_out_of_scope: >-
    С этим вопросом лучше поможет специалист — передаю ему переписку, повторять ничего не придётся.
  dispute: >-
    Понимаю, что данные не сходятся с тем, что видите вы. Передаю специалисту вместе с деталями
    операции — он разберётся и ответит здесь же.
  fraud: >-
    Похоже на мошенников. Сотрудники банка никогда не просят коды из SMS, CVC, PIN или пароль и не
    просят переводить деньги на «безопасный счёт». Ничего не сообщайте и прервите звонок. Срочно
    подключаю специалиста по безопасности.
  crisis: >-
    Мне очень жаль, что вам сейчас так тяжело. Вы не одни: я уже подключаю сотрудника, он ответит
    в ближайшие минуты. Если есть угроза жизни, пожалуйста, позвоните 112.
  other_person_data: >-
    Я могу показывать данные только по вашим картам и счетам. Если нужен доступ к счёту близкого
    человека, ему нужно оформить на вас доверенность или написать в чат самому.
  injection: >-
    Я помогаю только с вопросами по вашим картам, счетам и переводам. Чем могу помочь?
  investment: >-
    Я не даю инвестиционных советов и не могу ничего гарантировать по доходности. Могу подключить
    специалиста по инвестициям.
  external_email: >-
    Отправить данные можно только на e-mail, подтверждённый в профиле. Скачайте документ кнопкой
    в чате и перешлите его сами.
