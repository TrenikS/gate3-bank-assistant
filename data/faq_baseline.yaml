# Бейзлайн B «сценарный бот»: статичные FAQ-ответы без данных клиента (как типичный кнопочный бот).
declined_card_payment: >-
  Оплата может быть отклонена по нескольким причинам: недостаточно средств, превышен лимит, карта
  заблокирована или ошибка магазина. Проверьте баланс и лимиты в приложении: Карта → Лимиты.
declined_transfer: >-
  Перевод может быть отклонён из-за лимитов, недостатка средств или неверных реквизитов. Проверьте
  данные получателя и лимиты в разделе «Переводы».
card_payment_fee_charged: >-
  Комиссии взимаются согласно тарифам банка. Ознакомиться с тарифами можно на сайте банка в разделе
  «Тарифы и документы».
card_payment_not_recognised: >-
  Если вы не узнаёте операцию, проверьте её детали в истории операций. Название магазина в выписке
  может отличаться от вывески. Если операция подозрительная — заблокируйте карту в приложении.
transaction_charged_twice: >-
  Иногда сумма временно блокируется дважды и вторая блокировка снимается автоматически в течение
  нескольких дней. Если списание проведено дважды, обратитесь в магазин или к оператору.
extra_charge_on_statement: >-
  В выписке могут отображаться платы за услуги банка по тарифу: обслуживание, SMS-информирование,
  подписки. Подробности — в разделе «Тарифы и документы».
pending_transfer: >-
  Переводы обычно зачисляются в течение нескольких минут, по реквизитам — до 3 рабочих дней.
  Статус перевода можно посмотреть в истории операций.
transfer_not_received_by_recipient: >-
  Сроки зачисления зависят от банка получателя. Если перевод выполнен, попросите получателя
  обратиться в свой банк. Справку о переводе можно скачать в истории операций.
pending_card_payment: >-
  Операция в статусе «в обработке» означает, что сумма заблокирована до подтверждения магазином.
  Обычно это занимает до 30 дней.
card_arrival: >-
  Сроки доставки карты — от 3 до 14 рабочих дней в зависимости от региона. Статус доставки можно
  посмотреть в разделе «Карты».
Refund_not_showing_up: >-
  Возврат зачисляется после того, как магазин передаст его в банк, обычно до 30 дней. По вопросам
  возврата обратитесь в магазин.
activate_my_card: >-
  Чтобы активировать карту, откройте приложение: Карты → выберите карту → «Активировать».
change_pin: >-
  Сменить PIN-код можно в приложении: Карты → Настройки → «Сменить PIN» или в любом банкомате банка.
receiving_money: >-
  Реквизиты счёта можно найти в приложении: Счета → выберите счёт → «Реквизиты».
edit_personal_details: >-
  Изменить контактные данные можно в приложении в разделе «Профиль». Для смены ФИО и паспорта
  обратитесь в отделение.
compromised_card: >-
  Если вы подозреваете мошенничество, немедленно заблокируйте карту в приложении и позвоните по
  номеру на обороте карты.
lost_or_stolen_card: >-
  Если карта потеряна или украдена, заблокируйте её в приложении в разделе «Карты» и закажите перевыпуск.
other: >-
  Извините, я не понял вопрос. Выберите тему из меню или напишите «оператор», чтобы связаться со специалистом.
operator: >-
  Соединяю с оператором. Среднее время ожидания — 7 минут.
